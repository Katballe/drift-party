name: Deploy to Cloudflare

# Auto-deploy the Worker (build + wrangler deploy) on every push to main.
# Requires a repo secret CLOUDFLARE_API_TOKEN (a Cloudflare token with
# "Edit Cloudflare Workers" permissions on the Katballe account).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # npm run deploy = `vite build && wrangler deploy`; wrangler reads the
      # token + account id from the environment.
      - name: Build & deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "36fc8f0c4cec0df9978aa5a86d383984"
