<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Drift Party — Big Screen</title>
  <meta name="description" content="Host a Drift Party race. Friends join with their phones as controllers." />
  <meta name="theme-color" content="#1a2a0a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: #1a2a0a; overflow: hidden; font-family: 'Caveat', cursive; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { 0% { transform: scale(0.35); opacity: 0; } 65% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
    button:hover { filter: brightness(1.08); }
    button:active { filter: brightness(0.9); }
    button:focus-visible { outline: 3px solid #FFD600; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="root" style="width:100vw;height:100vh;background:#1a2a0a;position:relative;overflow:hidden;font-family:'Caveat',cursive">
    <!-- #stage is sized to the letterboxed 16:9 canvas; the HUD lives inside it. -->
    <div id="stage" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">
      <canvas id="raceCanvas" style="display:block"></canvas>
      <div id="hud"></div>
    </div>
    <div id="lobby"></div>
    <div id="countdown"></div>
    <div id="results"></div>
  </div>
  <script type="module" src="/src/screen/main.ts"></script>
</body>
</html>
