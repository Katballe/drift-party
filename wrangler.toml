name = "drift-party"
main = "src/worker/worker.ts"
compatibility_date = "2026-05-24"

# Built client (Vite → dist/) is served as static assets. Asset-first routing:
# static files (/screen/, /controller/, JS, fonts) are served directly; only
# non-asset requests (e.g. /ws) invoke the Worker.
[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"
# The realtime endpoint must always reach the Worker, never the SPA fallback.
run_worker_first = ["/ws"]

# Realtime rooms. SQLite-backed Durable Object (required for the Workers Free plan).
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Dev environment: `npm run deploy:dev` → Worker `drift-party-dev`, played at
# https://katballe-studio-dev.mkatballe.workers.dev/drift-party/ (the dev site
# forwards /drift-party/* here through a service binding, behind its password).
# Same Worker code; the client is the dev build (track editor on) with base
# /drift-party/. Its own Worker and rooms, so testing never touches the live
# game. No public workers.dev URL: the dev site is the only way in.
[env.dev]
name = "drift-party-dev"
workers_dev = false
preview_urls = false

[[env.dev.durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[env.dev.migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
